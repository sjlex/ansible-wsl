---
- name: "WSL-1 Playbook"
  hosts: all
  remote_user: "root"
  tags:
    - generic

  pre_tasks:
    - name: "Include external var file"
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - "{{ group_var_file | default('group_vars/wsl1.yml') }}"

  roles:
    # --------------------------------------------------------------------------
    # Generic
    # --------------------------------------------------------------------------

    # System
    - role: system

    # Base
    - role: base

    # User
    - role: user

    # --------------------------------------------------------------------------
    # Environment
    # --------------------------------------------------------------------------

    # WSL
    - role: wsl

- name: "WSL-1 Playbook"
  hosts: all
  become: true
  become_user: "{{ user_name }}"
  remote_user: "{{ user_name }}"
  tags:
    - apps
    - services

  roles:
    # --------------------------------------------------------------------------
    # Shell
    # --------------------------------------------------------------------------

    # Shell
    - role: fish
    - role: tmux
    - role: tmuxinator

    # --------------------------------------------------------------------------
    # Package manager
    # --------------------------------------------------------------------------

    - role: mise

    # --------------------------------------------------------------------------
    # Apps / Services
    # --------------------------------------------------------------------------

    # Git
    - role: git

    # Docker
    - role: docker
    - role: sjlex.collection.lazydocker

    # Text editors
    - role: sjlex.collection.nano
    - role: sjlex.collection.neovim

    # Utils
    - role: sjlex.collection.bat
    - role: sjlex.collection.eza
    - role: sjlex.collection.fzf

    # File managers
    - role: sjlex.collection.mc
    - role: broot

    # Monitoring
    - role: sjlex.collection.btop
    - role: htop
    - role: sjlex.collection.ncdu
