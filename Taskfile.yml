version: '3'

vars:
  VERSION: '1.7.0'
  DOCKER_IMAGE: 'ansible-wsl:{{.VERSION}}'

  DEV_ANSIBLE_COLLECTION_PATH: '/mnt/ansible-collection'
  DEV_ANSIBLE_COLLECTION_HOST_PATH: '../ansible-collection'

env:
  MOLECULE_INSTANCE_ID:
    sh: base64 < /dev/urandom | tr -d 'O0Il1+/' | head -c 6; printf '\n'

tasks:

  # ----------------------------------------------------------------------------
  # Default
  # ----------------------------------------------------------------------------
  default:
    desc: "Show all tasks"
    cmds:
      - ./bin/task --list-all

  # ----------------------------------------------------------------------------
  # Dependencies
  # ----------------------------------------------------------------------------

  "install":
    desc: "Install dependencies"
    cmds:
      - task: "dependencies:install"

  "dependencies:install":
    desc: "Install dependencies"
    cmds:
      - task: "dependencies:poetry:install-main"
      - task: "dependencies:ansible-galaxy:install"

  "dependencies:dev:install":
    desc: "Install all dependencies"
    cmds:
      - task: "dependencies:poetry:install"
      - task: "dependencies:dev:ansible-galaxy:install"

  "dependencies:poetry:install":
    desc: "Install dependencies (poetry: main + dev)"
    cmds:
      - poetry install
        --no-root
        --no-interaction
        {{.CLI_ARGS}}

  "dependencies:poetry:install-main":
    desc: "Install dependencies (poetry: only main)"
    cmds:
      - poetry install
        --only main
        --no-interaction
        {{.CLI_ARGS}}

  "dependencies:ansible-galaxy:install":
    desc: "Install dependencies (ansible-galaxy)"
    cmds:
      - poetry run
        ansible-galaxy install
          -r requirements.yml
          {{.CLI_ARGS}}

  "dependencies:dev:ansible-galaxy:install":
    desc: "Install dependencies (ansible-galaxy)"
    cmds:
      - poetry run
        ansible-galaxy install
          -r requirements.dev.yml
          {{.CLI_ARGS}}

  "dependencies:clear":
    desc: "Clear all dependencies"
    cmds:
      - poetry env remove --all
      - poetry cache clear --no-interaction --all .
      - pyenv version | awk '{print $1}' | xargs pyenv uninstall -f

  # ----------------------------------------------------------------------------
  # Ansible
  # ----------------------------------------------------------------------------

  "run:local:wsl1":
    desc: "Run an Ansible playbook locally (wsl-1)"
    env:
      ANSIBLE_CONFIG: ansible.cfg
    cmds:
      - poetry run
        ansible-playbook
          --connection=local
          --inventory 127.0.0.1,
          "playbooks/wsl1.yml"
          {{.CLI_ARGS}}

  "run:local:wsl2":
    desc: "Run an Ansible playbook locally (wsl-2)"
    env:
      ANSIBLE_CONFIG: ansible.cfg
    cmds:
      - poetry run
        ansible-playbook
        --connection=local
        --inventory 127.0.0.1,
        "playbooks/wsl2.yml"
        {{.CLI_ARGS}}

  # ----------------------------------------------------------------------------
  # Docker
  # ----------------------------------------------------------------------------

  "docker:run":
    desc: "Run docker container"
    cmds:
      - task: "docker:container:run:shell"

  "docker:dev:run":
    desc: "Run docker dev container"
    cmds:
      - task: "docker:dev:container:run:shell"

  "docker:build":
    desc: "Build docker image"
    cmds:
      - task: "docker:image:build"

  "docker:image:build":
    desc: "Build docker image"
    cmds:
      - docker buildx build
        --build-context ansible-collection={{.DEV_ANSIBLE_COLLECTION_HOST_PATH}}
        -t {{.DOCKER_IMAGE}}
        -f Dockerfile.dev
        {{.ROOT_DIR}}
        {{.CLI_ARGS}}

  "docker:container:run:shell":
    desc: "Run docker container"
    cmds:
      - docker run -it --rm
        -v {{.ROOT_DIR}}:/usr/src
        -v /var/run/docker.sock:/var/docker.sock
        -v $HOME/.vagrant.d/boxes:/root/.vagrant.d/boxes
        -w /usr/src
        --privileged
        {{.DOCKER_IMAGE}}
        {{.CLI_ARGS}} || true

  "docker:dev:container:run:shell":
    desc: "Run docker container"
    cmds:
      - docker run -it --rm
        -v {{.ROOT_DIR}}:/usr/src
        -v /var/run/docker.sock:/var/docker.sock
        -v $HOME/.vagrant.d/boxes:/root/.vagrant.d/boxes
        -v {{.DEV_ANSIBLE_COLLECTION_HOST_PATH}}:{{.DEV_ANSIBLE_COLLECTION_PATH}}
        -w /usr/src
        --privileged
        {{.DOCKER_IMAGE}}
        {{.CLI_ARGS}} || true

  # ----------------------------------------------------------------------------
  # Test
  # ----------------------------------------------------------------------------

  "test":
    desc: "Run all tests"
    cmds:
      - task: "test:all"

  "test:all":
    desc: "Run all tests"
    cmds:
      - task: "test:integration:all"
      - task: "test:role:all"

  "test:integration:all":
    desc: "Run all integration tests"
    cmds:
      - task: "test:integration:default"
      - task: "test:integration:main-vm"

  "test:integration:default":
    desc: "Test (default)"
    cmds:
      - poetry run
        molecule test -s default
        {{.CLI_ARGS}}

  "test:integration:main-vm":
    desc: "Test playbook (main-vm)"
    cmds:
      - poetry run
        molecule test -s main-vm
        {{.CLI_ARGS}}

  "test:role:all":
    desc: "Test all roles and scenarios"
    cmds:
      - cmd: |
          rc=0
          for molecule_dir in roles/*/molecule; do
          (
            cd $(dirname $molecule_dir) &&
            poetry run \
            molecule test --all
          ) || rc=$?

          if [ $rc -ne 0 ]; then break; exit $rc; fi
          done

  "test:role":
    desc: "Test a role"
    vars:
      ROLE_NAME: "{{.CLI_ARGS}}"
      ROLE_DIR:
        sh: |
          for molecule_dir in roles/*/molecule; do
            if [ $(echo $molecule_dir | grep -io "{{.ROLE_NAME}}") ]; then
              echo $(dirname $molecule_dir)
            fi
          done
    preconditions:
      - sh: '[ {{.ROLE_DIR}} ]'
        msg: "Role not found"
    cmds:
      - cmd: |
          cd {{.ROLE_DIR}}
          poetry run \
          molecule test --all

  # ----------------------------------------------------------------------------
  # Lint
  # ----------------------------------------------------------------------------

  "lint":
    desc: "Run linting"
    deps:
      - task: "lint:yamllint"
      - task: "lint:ansible-lint"
      - task: "lint:ruff"
      - task: "lint:black"

  "lint:fix":
    desc: "Run linting and write to files"
    cmds:
      - task: "lint:ruff:fix"
      - task: "lint:black:fix"

  "lint:yamllint":
    desc: "Linting (yamllint)"
    cmds:
      - poetry run
        yamllint
          --config-file .yamllint.yml
          --strict
          {{.ROOT_DIR}}
          {{.CLI_ARGS}}

  "lint:ansible-lint":
    desc: "Linting (ansible-lint)"
    cmds:
      - poetry run
        ansible-lint
          --config-file .ansible-lint.yml
          --exclude molecule.yml
          --offline
          --format=pep8
          playbooks/*
          {{.ROOT_DIR}}/*
          {{.CLI_ARGS}}

  "lint:ansible-lint:clear":
    desc: "Clear ansible-lint cache"
    cmds:
      - rm -rf .cache/ansible-lint
      - rm -rf .ansible

  "lint:ruff":
    desc: "Linting (ruff)"
    cmds:
      - poetry run
        ruff check
          {{.ROOT_DIR}}
          {{.CLI_ARGS}}

  "lint:ruff:fix":
    desc: "Reformat (ruff)"
    cmds:
      - poetry run
        ruff check --fix
          {{.ROOT_DIR}}
          {{.CLI_ARGS}}

  "lint:ruff:clear":
    desc: "Clear ruff cache"
    cmds:
      - rm -rf .ruff_cache

  "lint:black":
    desc: "Linting (black)"
    cmds:
      - poetry run
        black
          --check
          --diff
          --line-length=120
          {{.ROOT_DIR}}
          {{.CLI_ARGS}}

  "lint:black:fix":
    desc: "Reformat (black)"
    cmds:
      - poetry run
        black
          --line-length=120
          {{.ROOT_DIR}}
          {{.CLI_ARGS}}

  # ----------------------------------------------------------------------------
  # Clear
  # ----------------------------------------------------------------------------

  "clear":
    desc: "Clear"
    deps:
      - task: "clear:all"

  "clear:all":
    desc: "Clear all"
    cmds:
      - task: "lint:ansible-lint:clear"
      - task: "lint:ruff:clear"
      - task: "dependencies:clear"
