# Set Leader Key
unbind C-b
set -g prefix M-j
bind M-j send-prefix

# Disable mouse copy
unbind-key -T root MouseDrag1Pane
unbind-key -T root DoubleClick1Pane
unbind-key -T root TripleClick1Pane

bind v copy-mode \; send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind f copy-mode \; command-prompt -p "Search up:" "send -X search-backward '%%'"

unbind C-l
bind C-l copy-mode \; send-keys -X start-of-line \; send-keys -X begin-selection \; send-keys -X end-of-line
bind -T copy-mode-vi C-l send-keys -X back-to-indentation \; send-keys -X begin-selection \; send-keys -X end-of-line

bind M-z send-keys -X search-again
bind M-m send-keys -X search-reverse
bind -T copy-mode-vi M-z send-keys -X search-again
bind -T copy-mode-vi M-m send-keys -X search-reverse

bind -T copy-mode-vi C-Left  send-keys -X previous-word
bind -T copy-mode-vi C-Right send-keys -X next-word

bind -T copy-mode-vi Home send-keys -X start-of-line
bind -T copy-mode-vi End  send-keys -X end-of-line
bind Home copy-mode \; send-keys -X begin-selection \; send-keys -X start-of-line
bind End  copy-mode \; send-keys -X begin-selection \; send-keys -X end-of-line

# Ctrl+Enter
bind-key -n C-Enter send-keys Escape "[13;5u"

# Ctrl+Shift+F
bind-key -n C-F send-keys Escape "[70;5u"

# Ctrl+Shift+R
bind-key -n C-R send-keys Escape "[82;5u"

# Ctrl+Shift+G
bind-key -n C-G send-keys Escape "[71;5u"

# --- Scroll ---

# PageScroll
bind-key -n PageUp send-keys PageUp
bind-key -n PageDown send-keys PageDown

# PageScroll: Tmux (halfpage scroll)
bind-key -n S-PageUp copy-mode \; send-keys -X halfpage-up
bind-key -n S-PageDown send-keys -X halfpage-down

bind-key -T copy-mode-vi S-PageUp   send-keys -X halfpage-up
bind-key -T copy-mode-vi S-PageDown send-keys -X halfpage-down
bind-key -T copy-mode    S-PageUp   send-keys -X halfpage-up
bind-key -T copy-mode    S-PageDown send-keys -X halfpage-down

bind C-S-Home copy-mode \; send-keys -X history-top
bind C-S-End  copy-mode \; send-keys -X history-bottom
bind -T copy-mode-vi C-S-Home send-keys -X history-top
bind -T copy-mode-vi C-S-End  send-keys -X history-bottom
bind -n C-S-Home copy-mode \; send-keys -X history-top
bind -n C-S-End  copy-mode \; send-keys -X history-bottom

# --- Windows ---

# Switch between windows
bind-key -n C-Tab next-window
bind-key -n C-BTab previous-window

# --- Panels ---

# Use vim-like keys for splits and windows
bind-key V split-window -h
bind-key S split-window -v

# Maximize
bind-key -n M-S-F11 resize-pane -Z

# Focus
set -s user-keys[0] "\e[25~"
set -s user-keys[1] "\e[26~"
set -s user-keys[2] "\e[28~"
set -s user-keys[3] "\e[29~"

bind-key -n User0 select-pane -U
bind-key -n User1 select-pane -D
bind-key -n User2 select-pane -L
bind-key -n User3 select-pane -R

# Split
set -s user-keys[4] "\e[25;2~"
set -s user-keys[5] "\e[26;2~"
set -s user-keys[6] "\e[28;2~"
set -s user-keys[7] "\e[29;2~"

bind-key -n User4 split-window -vb -c "#{pane_current_path}"
bind-key -n User5 split-window -v  -c "#{pane_current_path}"
bind-key -n User6 split-window -hb -c "#{pane_current_path}"
bind-key -n User7 split-window -h  -c "#{pane_current_path}"

# Move
set -s user-keys[8] "\e[25;5~"
set -s user-keys[9] "\e[26;5~"
set -s user-keys[10] "\e[28;5~"
set -s user-keys[11] "\e[29;5~"

bind-key -n User8 swap-pane -U
bind-key -n User9 swap-pane -D
bind-key -n User10 { select-pane -L; swap-pane -s '!' }
bind-key -n User11 { select-pane -R; swap-pane -s '!' }

# Resize
set -s user-keys[12] "\e[25;3~"
set -s user-keys[13] "\e[26;3~"
set -s user-keys[14] "\e[28;3~"
set -s user-keys[15] "\e[29;3~"

bind-key -n User12 resize-pane -U 1
bind-key -n User13 resize-pane -D 1
bind-key -n User14 resize-pane -L 1
bind-key -n User15 resize-pane -R 1
