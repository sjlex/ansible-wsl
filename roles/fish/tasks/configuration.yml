---
- name: "Copy fish config"
  ansible.builtin.copy:
    src: fish
    dest: '{{ ansible_facts["env"]["HOME"] }}/.config/'
    mode: '0700'

- name: "Reload config"
  ansible.builtin.shell: |
    source '{{ ansible_facts["env"]["HOME"] }}/.config/fish/config.fish'
  args:
    executable: "/usr/bin/fish"
  register: __fish_config_rg
  failed_when: false
  changed_when: false
